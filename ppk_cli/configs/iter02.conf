# Phase 1 — Iteration 02: iter01 + base antenna height (rnx2rtkp, RTKLIB-EX v2.5.1)
# Change vs iter01: ant2-antdelu = 1.895 m (1.800 m pole from RINEX ANTENNA: DELTA H
# + 0.095 m RS4 L1 phase-center offset per Emlid docs). Iter01 showed a constant
# -1.8947 m vertical offset vs Emlid Studio (rnx2rtkp ignored the RINEX delta;
# ES applies pole + APC). Horizontal already agreed at ~1 cm.

pos1-posmode       =kinematic
pos1-frequency     =l1+l2
pos1-soltype       =forward
pos1-elmask        =15
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =on
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-exclsats      =
pos1-navsys        =61        # 1 GPS + 4 GLO + 8 GAL + 16 QZS + 32 BDS

pos2-armode        =fix-and-hold
pos2-gloarmode     =fix-and-hold
pos2-bdsarmode     =on
pos2-arthres       =3
pos2-arlockcnt     =5
pos2-arelmask      =15
pos2-elmaskhold    =15
pos2-aroutcnt      =20
pos2-maxage        =30
pos2-rejionno      =1000

out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-timesys        =gpst
out-timeform       =hms
out-degform        =deg
out-height         =ellipsoidal

stats-eratio1      =300
stats-eratio2      =300

ant1-postype       =single
ant2-postype       =rinexhead
ant2-antdele       =0
ant2-antdeln       =0
ant2-antdelu       =1.895
