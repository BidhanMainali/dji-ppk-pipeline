# Phase 1 — Iteration 01: starting config for rnx2rtkp (RTKLIB-EX v2.5.1, Demo5 lineage)
# Goal: replicate Emlid Studio 1.9 result on reference flight DJI_202605221253_006
# ES baseline: 96.1% FIX epochs (3899/4058), 601/609 events FIX
# Rationale: kinematic drone rover, dual-freq L1+L2 (common rover/base set),
# forward filter (ES .pos sd converges from 2.1 m at start => forward pass),
# base position from RINEX header (ES ref pos matches base RINEX approx pos + antenna delta).

pos1-posmode       =kinematic
pos1-frequency     =l1+l2
pos1-soltype       =forward
pos1-elmask        =15
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =on
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-exclsats      =
pos1-navsys        =61        # 1 GPS + 4 GLO + 8 GAL + 16 QZS + 32 BDS

pos2-armode        =fix-and-hold
pos2-gloarmode     =fix-and-hold
pos2-bdsarmode     =on
pos2-arthres       =3
pos2-arlockcnt     =5
pos2-arelmask      =15
pos2-elmaskhold    =15
pos2-aroutcnt      =20
pos2-maxage        =30
pos2-rejionno      =1000

out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-timesys        =gpst
out-timeform       =hms
out-degform        =deg
out-height         =ellipsoidal

stats-eratio1      =300
stats-eratio2      =300

ant1-postype       =single
ant2-postype       =rinexhead
